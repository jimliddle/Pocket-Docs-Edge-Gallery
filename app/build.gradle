plugins { id 'com.android.application' }
android {
 namespace 'com.jimliddle.pocketdocs'
 compileSdk 35
 defaultConfig { applicationId 'com.jimliddle.pocketdocs.semantic'; minSdk 26; targetSdk 35; versionCode 3; versionName '0.3.0'; ndk { abiFilters 'arm64-v8a' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 androidResources { noCompress += ['onnx'] }
 packaging { jniLibs { useLegacyPackaging=true }; resources { excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE*','META-INF/NOTICE*'] } }
 testOptions { unitTests.returnDefaultValues=true }
}
dependencies {
 implementation 'androidx.documentfile:documentfile:1.0.1'
 implementation 'org.nanohttpd:nanohttpd:2.3.1'
 implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
 implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
 implementation 'com.google.mlkit:text-recognition:16.0.1'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 testImplementation 'org.robolectric:robolectric:4.14.1'
}
tasks.withType(Test).configureEach {
 ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort','javax.net.ssl.trustStore','java.io.tmpdir'].each { key -> if(System.getProperty(key))systemProperty key,System.getProperty(key) }
}
